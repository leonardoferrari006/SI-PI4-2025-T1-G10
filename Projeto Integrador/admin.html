<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - TaNaMesa</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <style> body { font-family: 'Roboto', sans-serif; } </style>
</head>
<body class="bg-gray-100">

  <div class="container mx-auto p-4">
    <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow">
      <div>
        <h1 class="text-3xl font-bold text-orange-500">TaNaMesa - Admin</h1>
        <p class="text-gray-600">Visão Geral das Mesas</p>
      </div>
      <div>
        <button id="reset-btn" class="bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg flex items-center gap-2 mr-2">
          <span class="material-symbols-outlined">delete_forever</span>
          Resetar Sistema
        </button>
        <button id="refresh-btn" class="bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg flex items-center gap-2">
          <span class="material-symbols-outlined">refresh</span>
          Atualizar
        </button>
      </div>
    </header>

    <main>
      <!-- Tab Navigation -->
      <div class="mb-4 border-b border-gray-200">
        <nav class="flex space-x-4" aria-label="Tabs">
          <button id="tab-active" class="px-3 py-2 font-medium text-sm rounded-t-lg border-b-2 border-orange-500 text-orange-600">
            Mesas
          </button>
          <button id="tab-completed" class="px-3 py-2 font-medium text-sm rounded-t-lg text-gray-500 hover:text-gray-700 hover:border-gray-300">
            Finalizados
          </button>
        </nav>
      </div>

      <!-- Tab Panels -->
      <div id="panel-active">
        <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          <!-- Todas as 10 mesas serão renderizadas aqui pela função renderActiveTables -->
        </div>
      </div>

      <div id="panel-completed" class="hidden">
        <div id="completed-orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          <div id="no-completed-orders" class="text-center text-gray-500 col-span-full">
            <p>Nenhum pedido finalizado ainda.</p>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script src="admin.js"></script>
</body>
</html>
